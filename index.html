<body>

        <em id="brandSub"></em>

    </a>
    <nav class="main-nav" id="mainNav">
      <a href="#about">About</a>
      <a href="#impact">Impact</a>
      <a href="#programs">Programs</a>
      <a href="#gallery">Gallery</a>
      <a href="#team">Team</a>
      <a href="#report">Report</a>
      <a href="#contact" class="nav-cta">Get Involved</a>
    </nav>

      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="hero-media">
    <img src="" alt="SLOCO-YSG community outreach">
    <div class="hero-scrim"></div>
  </div>
  <div class="hero-inner" id="hero">
    <p class="dossier-tag"></p>
    <h1 class="hero-title"></h1>
    <p class="hero-sub"></p>
    <div class="hero-actions">
      <a href="#" class="btn btn-primary btn-shine"></a>
      <a href="#" class="btn btn-ghost"></a>
    </div>
  </div>
  <div class="hero-stat-strip" id="heroStats"></div>
</section>

<!-- ============ ABOUT ============ -->
<section class="section about" id="about">
  <div class="section-inner">
    <div class="about-copy reveal">
      <p class="eyebrow"></p>
      <h2></h2>
      <p class="lede"></p>
      <p class="body-text"></p>
      <div class="mvv-grid"></div>
    </div>
    <div class="leaders-block reveal">
      <p class="eyebrow leaders-eyebrow"></p>
      <h3 class="leaders-heading"></h3>
      <div class="leaders-grid" id="leadersGrid"></div>
    </div>
  </div>
</section>

<!-- ============ IMPACT LEDGER ============ -->
<section class="section ledger" id="impact">
  <div class="section-inner">
    <p class="eyebrow eyebrow-light"></p>
    <h2 class="ledger-title"></h2>
    <p class="ledger-lede"></p>
    <div class="ledger-table reveal"></div>
  </div>
</section>

<!-- ============ FEATURED PROJECT ============ -->
<section class="section featured" id="featured">
  <div class="section-inner featured-grid">
    <div class="featured-copy reveal">
      <p class="eyebrow"></p>
      <h2></h2>
      <p class="lede"></p>
      <p class="body-text"></p>
      <p class="callout"></p>
      <a href="#" class="text-link"></a>
    </div>
    <div class="featured-gallery reveal"></div>
  </div>
</section>

<!-- ============ PROGRAMS / REGISTER ============ -->
<section class="section programs" id="programs">
  <div class="section-inner">
    <p class="eyebrow"></p>
    <h2></h2>
    <p class="lede lede-narrow"></p>
    <div class="filter-row" id="filterRow"></div>
    <div class="register" id="register"></div>
  </div>
</section>

<!-- ============ GALLERY ============ -->
<section class="section gallery-section" id="gallery">
  <div class="section-inner">
    <p class="eyebrow eyebrow-light"></p>
    <h2 class="gallery-title"></h2>
  </div>
  <div class="gallery-grid reveal" id="galleryGrid"></div>
</section>

<!-- ============ TEAM ============ -->
<section class="section team" id="team">
  <div class="section-inner">
    <p class="eyebrow"></p>
    <h2></h2>
    <p class="lede lede-narrow"></p>
    <div class="team-grid" id="teamGrid"></div>
  </div>
</section>

<!-- ============ REPORT ============ -->
<section class="section report" id="report">
  <div class="section-inner report-grid">
    <div class="report-copy reveal">
      <p class="eyebrow eyebrow-light"></p>
      <h2></h2>
      <p class="lede"></p>
      <p class="body-text"></p>
      <div class="report-actions">
        <a href="#" target="_blank" rel="noopener" class="btn btn-primary btn-shine"></a>
        <span class="report-link-text"></span>
      </div>
    </div>
    <div class="report-visual reveal"><img src="" alt="Impact Beyond Office report cover"></div>
  </div>
</section>

<!-- ============ PARTNERS ============ -->
<section class="section partners">
  <div class="section-inner">
    <p class="partners-label"></p>
    <div class="partners-strip"></div>
  </div>
</section>

<!-- ============ CONTACT ============ -->
<section class="section contact" id="contact">
  <div class="section-inner contact-grid">
    <div class="contact-copy reveal">
      <p class="eyebrow eyebrow-light"></p>
      <h2></h2>
      <p class="lede"></p>
      <ul class="contact-list" id="contactList"></ul>
    </div>
    <form class="contact-form reveal" id="contactForm">
      <div class="form-row">
        <label for="fname">Full name</label>
        <input id="fname" name="name" type="text" required placeholder="Your name">
      </div>
      <div class="form-row">
        <label for="femail">Email</label>
        <input id="femail" name="email" type="email" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label for="fsubject">I&rsquo;m reaching out about</label>
        <select id="fsubject" name="subject">
          <option>Partnership / Sponsorship</option>
          <option>Requesting outreach in my community</option>
          <option>Volunteering</option>
          <option>Media enquiry</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-row">
        <label for="fmessage">Message</label>
        <textarea id="fmessage" name="message" rows="4" required placeholder="Tell us how you&rsquo;d like to be involved"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-shine">Send message</button>
      <p class="form-note" id="formNote" role="status"></p>
    </form>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="section-inner footer-grid">
    <div class="footer-brand">
      <strong id="footerBrandName"></strong>
      <p id="footerTagline"></p>
    </div>
    <div class="footer-links">
      <h4>Explore</h4>
      <a href="#about">About</a>
      <a href="#programs">Programs</a>
      <a href="#gallery">Gallery</a>
      <a href="#team">Team</a>
      <a href="#report">Impact Report</a>
    </div>
    <div class="footer-links">
      <h4>Office</h4>
      <a href="mailto:sloco.ysg@gmail.com">sloco.ysg@gmail.com</a>
      <a href="tel:+2347089669893">0708 966 9893</a>
    </div>
  </div>
  <div class="footer-base">
    <span>&copy; <span id="year"></span> <span id="footerBrandName2">SLOCO&ndash;YSG</span> &mdash; Office of the Senior Liaison Officer to the Governor of Yobe State.</span>
    <span id="footerNote"></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

</body>
</html>
